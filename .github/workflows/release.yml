name: Release DMG
run-name: Release ${{ inputs.version_tag }} from main

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'New version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      VERSION_TAG: ${{ inputs.version_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate version and reject an existing tag
        run: |
          ./scripts/package-dmg.sh "$VERSION_TAG" --validate-only
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$VERSION_TAG\") | .ref")"
          if [[ -n "$existing_ref" ]]; then
            echo "::error::Tag $VERSION_TAG already exists. Supply a new version."
            exit 1
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/release-tags.txt"
          python3 - <<'PY'
          import os, pathlib, re
          candidate = tuple(map(int, os.environ['VERSION_TAG'][1:].split('.')))
          tags = pathlib.Path(os.environ['RUNNER_TEMP'], 'release-tags.txt').read_text().splitlines()
          for tag in tags:
              if re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag):
                  if tuple(map(int, tag[1:].split('.'))) >= candidate:
                      raise SystemExit(f'Supply a version newer than published release {tag}.')
          PY
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - name: Require the update signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::Configure the SPARKLE_PRIVATE_KEY repository secret before releasing."
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build and package Apple Silicon app
        run: ./scripts/package-dmg.sh "$VERSION_TAG"

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/generate-appcast.sh "$VERSION_TAG"

      - name: Save DMG and checksum as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scribe-${{ inputs.version_tag }}-arm64
          path: |
            build/Scribe-${{ inputs.version_tag }}-arm64.dmg
            build/Scribe-${{ inputs.version_tag }}-arm64.dmg.sha256
            build/appcast.xml
          if-no-files-found: error
          compression-level: 0

      - name: Tag the built commit and publish GitHub Release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Requires an Apple Silicon Mac and macOS 15 or newer.

          Open the DMG and drag Scribe into Applications. Download the transcription models once in Settings; recordings and transcription stay on your Mac.

          This build is ad-hoc signed and is not notarized by Apple. If macOS says it cannot verify Scribe:

          1. Copy Scribe to Applications and try opening it there. Choose Done in the warning.
          2. Open System Settings → Privacy & Security, scroll to Security, and click Open Anyway next to Scribe.
          3. Confirm Open and authenticate if prompted.

          Approve only a release you trust from this repository. See Apple's instructions: https://support.apple.com/en-us/102445
          Sparkle update signatures verify updates; they do not replace Apple notarization.
          NOTES
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$VERSION_TAG" -f sha="$RELEASE_SHA" --silent
          gh release create "$VERSION_TAG" \
            "build/Scribe-$VERSION_TAG-arm64.dmg" \
            "build/Scribe-$VERSION_TAG-arm64.dmg.sha256" \
            "build/appcast.xml" \
            --verify-tag --latest --title "Scribe $VERSION_TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/release-notes.md"
